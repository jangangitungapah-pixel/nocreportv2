name: GEN-F4 validated formatting

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f4-format.yml

permissions:
  contents: write

jobs:
  format-gen-f4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Persist exact repository formatting
        run: npm run format
      - name: Run focused GEN-F4 regressions
        run: |
          npx vitest run \
            src/features/ticket-generator/components/SmartPasteParser.validation.test.jsx \
            src/features/ticket-generator/components/ValidationCenter.test.jsx \
            src/features/ticket-generator/lib/timeIntelligence.test.js \
            src/features/ticket-generator/lib/validationCenter.test.js \
            src/features/ticket-generator/pages/TicketGeneratorPage.test.jsx
      - name: Run full unit and component suite
        run: npm test
      - name: Commit validated formatting only
        shell: bash
        run: |
          git add -- \
            src/features/ticket-generator/components/SmartPasteParser.jsx \
            src/features/ticket-generator/lib/validationCenter.test.js
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(generator): persist GEN-F4 validated formatting"
          git push origin HEAD:feature/template-generator-features
