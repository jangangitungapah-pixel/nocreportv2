name: GEN-F3 wiring recovery

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f3-wire-recovery.yml

permissions:
  contents: write

jobs:
  wire-gen-f3-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Patch GEN-F3 integration points with assertions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          parser = Path('src/features/ticket-generator/lib/smartReportParser.js')
          text = parser.read_text()
          text = replace_once(text, "const FIELD_DEFINITIONS = [\n", "import { cleanImpactCandidate, mergeImpactValues } from './impactCandidates.js';\n\nconst FIELD_DEFINITIONS = [\n", 'parser import')
          text = replace_once(text, """function cleanImpactLine(line) {\n  return normalizeLine(line)\n    .replace(/^\\d+\\s*[.)-]\\s*/, '')\n    .replace(/^[•-]\\s*/, '')\n    .trim();\n}\n\n""", '', 'legacy cleaner')
          text = replace_once(text, "      const impact = cleanImpactLine(line);\n", "      const impact = cleanImpactCandidate(line);\n", 'shared cleaner')
          text = replace_once(text, "  values.impactList = impactRows.map((value) => ({ value }));\n  const progress = inferProgressDateTimes(progressRows, values.occurAt);\n", "  const dedupedImpactRows = mergeImpactValues([], impactRows);\n  values.impactList = dedupedImpactRows.map((value) => ({ value }));\n  const progress = inferProgressDateTimes(progressRows, values.occurAt);\n", 'dedupe output')
          text = replace_once(text, "      impactCount: impactRows.length,\n", "      impactCount: dedupedImpactRows.length,\n", 'impact stats')
          parser.write_text(text)

          parser_test = Path('src/features/ticket-generator/lib/smartReportParser.test.js')
          test_text = parser_test.read_text()
          marker = "  test('supports canonical Title and Impact List labels', () => {\n"
          addition = """  test('filters exact-normalized duplicate Impact rows while preserving order', () => {\n    const parsed = parseSmartReport(`Title : *[MANDAU] TEST [TT : INC-20260825-00000002]*\nImpact List :\n1. SITE_A\n- site_a\n- SITE A\n- SITE_B\nOccur Time = 25/08/2026 01:10`);\n\n    expect(parsed.values.impactList).toEqual([\n      { value: 'SITE_A' },\n      { value: 'SITE A' },\n      { value: 'SITE_B' },\n    ]);\n    expect(parsed.stats.impactCount).toBe(3);\n  });\n\n"""
          test_text = replace_once(test_text, marker, addition + marker, 'parser regression')
          parser_test.write_text(test_text)

          page = Path('src/features/ticket-generator/pages/TicketGeneratorPage.jsx')
          page_text = page.read_text()
          page_text = replace_once(page_text, "import { DEFAULT_TICKET_FORM, buildTicketFromForm } from '../lib/formToTicket.js';\n", "import { DEFAULT_TICKET_FORM, buildTicketFromForm } from '../lib/formToTicket.js';\nimport { mergeImpactValues } from '../lib/impactCandidates.js';\n", 'page import')
          page_text = replace_once(page_text, "  const applyExtractedCoordinate = (candidate) => {\n", """  const applyImpactCandidates = (values) => {\n    const currentImpact = getValues('impactList') ?? [];\n    const mergedImpact = mergeImpactValues(currentImpact, values).map((value) => ({ value }));\n    replace(mergedImpact);\n    setValue('impactList', mergedImpact, {\n      shouldDirty: true,\n      shouldTouch: true,\n      shouldValidate: true,\n    });\n    pushToast({\n      title: 'Impact proposals applied',\n      message: `${values.length} selected Impact item${values.length === 1 ? '' : 's'} added to the local draft.`,\n      tone: 'success',\n    });\n  };\n\n  const applyExtractedCoordinate = (candidate) => {\n""", 'impact handler')
          page_text = replace_once(page_text, """      <ImpactListEditor\n        fields={fields}\n        register={register}\n        append={append}\n        remove={remove}\n        move={move}\n      />\n""", """      <ImpactListEditor\n        fields={fields}\n        register={register}\n        append={append}\n        remove={remove}\n        move={move}\n        currentValues={watchedValues?.impactList ?? []}\n        onApplyCandidates={applyImpactCandidates}\n      />\n""", 'impact props')
          page_text = replace_once(page_text, "      <ProgressComposer onAdd={addProgress} />\n", "      <ProgressComposer onAdd={addProgress} profileId={featureMetadata.templateProfileId} />\n", 'progress profile')
          page.write_text(page_text)
          PY
      - run: |
          npx prettier --write \
            src/features/ticket-generator/lib/smartReportParser.js \
            src/features/ticket-generator/lib/smartReportParser.test.js \
            src/features/ticket-generator/pages/TicketGeneratorPage.jsx
      - name: Run focused GEN-F3 regression matrix
        run: |
          npx vitest run \
            src/features/ticket-generator/lib/impactCandidates.test.js \
            src/features/ticket-generator/components/ImpactBuilder.test.jsx \
            src/features/ticket-generator/lib/progressSnippets.test.js \
            src/features/ticket-generator/lib/templateProfiles.test.js \
            src/features/ticket-generator/components/ProgressComposer.test.jsx \
            src/features/ticket-generator/lib/smartReportParser.test.js \
            src/features/ticket-generator/lib/reportTextAdapter.test.js \
            src/features/ticket-generator/pages/TicketGeneratorPage.test.jsx
      - name: Commit validated wiring
        shell: bash
        run: |
          git add \
            src/features/ticket-generator/lib/smartReportParser.js \
            src/features/ticket-generator/lib/smartReportParser.test.js \
            src/features/ticket-generator/pages/TicketGeneratorPage.jsx
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(generator): wire GEN-F3 Impact and Progress acceleration"
          git push origin HEAD:feature/template-generator-features
