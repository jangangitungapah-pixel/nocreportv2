name: GEN-F2 persist validated formatting

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f2-format-persist.yml

permissions:
  contents: write

jobs:
  persist-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply the exact Prettier gate to GEN-F2 files
        run: |
          npx prettier --write \
            src/entities/ticket/ticket-schema-v2.test.js \
            src/features/ticket-generator/components/SmartPasteParser.jsx \
            src/features/ticket-generator/lib/smartTitle.js \
            src/infrastructure/firebase/firestoreSecurityRules.emulator.test.js
      - name: Verify targeted GEN-F2 regressions
        run: |
          npx vitest run \
            src/entities/ticket/ticket-schema-v2.test.js \
            src/features/ticket-generator/pages/TicketGeneratorSmartTitle.test.jsx \
            src/features/ticket-generator/lib/smartTitle.test.js \
            src/features/ticket-generator/lib/formToTicketV2.test.js
      - name: Commit validated formatting only
        shell: bash
        run: |
          git add \
            src/entities/ticket/ticket-schema-v2.test.js \
            src/features/ticket-generator/components/SmartPasteParser.jsx \
            src/features/ticket-generator/lib/smartTitle.js \
            src/infrastructure/firebase/firestoreSecurityRules.emulator.test.js
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(generator): persist GEN-F2 validated formatting"
          git push origin HEAD:feature/template-generator-features
