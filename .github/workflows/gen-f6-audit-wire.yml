name: GEN-F6 audit wire

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f6-audit-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Patch GEN-F6 audit diff wiring
        run: |
          python3 <<'PY'
          from pathlib import Path

          mutation = Path('src/infrastructure/firebase/firestoreTicketMutations.js')
          text = mutation.read_text()

          old_import = """import {\n  TICKET_STATUS,\n  createEmptyTicket,\n  extractExternalTicketNumber,\n  normalizeCoordinates,\n  validateRunningRequirements,\n  validateTicketTransition,\n} from '../../entities/ticket/index.js';"""
          new_import = """import {\n  TICKET_STATUS,\n  buildTicketUpdatedAuditDetails,\n  createEmptyTicket,\n  extractExternalTicketNumber,\n  normalizeCoordinates,\n  validateRunningRequirements,\n  validateTicketTransition,\n} from '../../entities/ticket/index.js';"""
          if old_import not in text:
              raise SystemExit('mutation import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_audit = """function auditData(type, actorUid, details = null) {\n  return {\n    type,\n    actorUid,\n    details,\n    createdAt: serverTimestamp(),\n  };\n}"""
          new_audit = """function auditData(type, actorUid, details = null, metadata = null) {\n  return {\n    ...(metadata ?? {}),\n    type,\n    actorUid,\n    details,\n    createdAt: serverTimestamp(),\n  };\n}"""
          if old_audit not in text:
              raise SystemExit('auditData anchor not found')
          text = text.replace(old_audit, new_audit, 1)

          old_candidate = """      const candidate = createEmptyTicket({\n        ...current,\n        ...patch,\n        id: ticketId,\n        schemaVersion: 2,\n      });\n      const auditRef = doc(collection(ticketRef, 'auditEvents'));\n\n      transaction.update(ticketRef, {\n        ...schemaV2FeatureData(candidate),\n        title: candidate.title,\n        externalTtNumber:\n          patch.externalTtNumber ?? extractExternalTicketNumber(candidate.title) ?? null,"""
          new_candidate = """      const candidate = createEmptyTicket({\n        ...current,\n        ...patch,\n        id: ticketId,\n        schemaVersion: 2,\n      });\n      const nextExternalTtNumber =\n        patch.externalTtNumber ?? extractExternalTicketNumber(candidate.title) ?? null;\n      const auditedCandidate = createEmptyTicket({\n        ...candidate,\n        externalTtNumber: nextExternalTtNumber,\n      });\n      const revisionFrom = Number(expectedRevision);\n      const revisionTo = revisionFrom + 1;\n      const audit = buildTicketUpdatedAuditDetails({\n        previousTicket: current,\n        nextTicket: auditedCandidate,\n        revisionFrom,\n        revisionTo,\n      });\n      const auditRef = doc(collection(ticketRef, 'auditEvents'));\n\n      transaction.update(ticketRef, {\n        ...schemaV2FeatureData(auditedCandidate),\n        title: auditedCandidate.title,\n        externalTtNumber: nextExternalTtNumber,"""
          if old_candidate not in text:
              raise SystemExit('save candidate anchor not found')
          text = text.replace(old_candidate, new_candidate, 1)

          text = text.replace('        impactList: candidate.impactList,\n        occurAt: candidate.occurAt,\n        dispatchAt: candidate.dispatchAt,\n        pic: candidate.pic,\n        rootcause: candidate.rootcause,\n        cutPoint: candidate.cutPoint,', '        impactList: auditedCandidate.impactList,\n        occurAt: auditedCandidate.occurAt,\n        dispatchAt: auditedCandidate.dispatchAt,\n        pic: auditedCandidate.pic,\n        rootcause: auditedCandidate.rootcause,\n        cutPoint: auditedCandidate.cutPoint,', 1)
          text = text.replace('        revision: Number(expectedRevision) + 1,\n      });\n      transaction.set(auditRef, auditData(\'TICKET_UPDATED\', user.uid));', """        revision: revisionTo,\n      });\n      transaction.set(\n        auditRef,\n        auditData('TICKET_UPDATED', user.uid, audit.details, {\n          revisionFrom: audit.revisionFrom,\n          revisionTo: audit.revisionTo,\n        }),\n      );""", 1)
          mutation.write_text(text)

          test_file = Path('src/features/ticket-generator/lib/ticketRevisionDiff.test.js')
          test_text = test_file.read_text()
          old_test_import = """import {\n  REVISION_DIFF_ALARM_FIELDS,\n  buildOperationalRevisionDiff,\n  buildTicketUpdatedAuditDetails,\n} from './ticketRevisionDiff.js';"""
          new_test_import = """import {\n  REVISION_DIFF_ALARM_FIELDS,\n  buildOperationalRevisionDiff,\n  buildTicketUpdatedAuditDetails,\n} from '../../../entities/ticket/index.js';"""
          if old_test_import not in test_text:
              raise SystemExit('revision diff test import anchor not found')
          test_file.write_text(test_text.replace(old_test_import, new_test_import, 1))

          duplicate = Path('src/features/ticket-generator/lib/ticketRevisionDiff.js')
          if not duplicate.exists():
              raise SystemExit('feature revision diff duplicate missing')
          duplicate.unlink()

          emulator = Path('src/infrastructure/firebase/firestoreTicketRepository.emulator.test.js')
          emu_text = emulator.read_text()
          old_assert = """    expect(saved.revision).toBe(2);\n    expect(saved.ticket.rootcause).toBe('Fiber cut after forest fire impact');"""
          new_assert = """    expect(saved.revision).toBe(2);\n    expect(saved.ticket.rootcause).toBe('Fiber cut after forest fire impact');\n\n    const auditSnapshot = await getDocs(\n      collection(getFirestoreClient(), 'tickets', created.ticketId, 'auditEvents'),\n    );\n    const updatedAudit = auditSnapshot.docs\n      .map((item) => item.data())\n      .find((event) => event.type === 'TICKET_UPDATED');\n    expect(updatedAudit).toMatchObject({\n      revisionFrom: 1,\n      revisionTo: 2,\n      details: {\n        changes: {\n          rootcause: { from: '', to: 'Fiber cut after forest fire impact' },\n        },\n      },\n    });"""
          if old_assert not in emu_text:
              raise SystemExit('emulator save assertion anchor not found')
          emulator.write_text(emu_text.replace(old_assert, new_assert, 1))
          PY
      - name: Format changed sources
        run: npx prettier --write src/entities/ticket/lib/revision-diff.js src/entities/ticket/index.js src/features/ticket-generator/lib/ticketRevisionDiff.test.js src/infrastructure/firebase/firestoreTicketMutations.js src/infrastructure/firebase/firestoreTicketRepository.emulator.test.js
      - name: Unit regression
        run: npx vitest run src/features/ticket-generator/lib/ticketRevisionDiff.test.js
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/entities/ticket/lib/revision-diff.js src/entities/ticket/index.js src/features/ticket-generator/lib/ticketRevisionDiff.test.js src/features/ticket-generator/lib/ticketRevisionDiff.js src/infrastructure/firebase/firestoreTicketMutations.js src/infrastructure/firebase/firestoreTicketRepository.emulator.test.js
          git diff --cached --check
          git commit -m "feat(generator): wire compact revision audit diff"
          git push origin HEAD:feature/template-generator-features
