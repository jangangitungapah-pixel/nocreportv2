name: GEN-F3 validated formatting

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f3-format.yml

permissions:
  contents: write

jobs:
  format-gen-f3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Persist exact repository formatting
        run: npm run format
      - name: Run focused GEN-F3 regression matrix
        run: |
          npx vitest run \
            src/features/ticket-generator/lib/impactCandidates.test.js \
            src/features/ticket-generator/components/ImpactBuilder.test.jsx \
            src/features/ticket-generator/lib/progressSnippets.test.js \
            src/features/ticket-generator/components/ProgressComposer.test.jsx \
            src/features/ticket-generator/lib/persistenceServiceProgress.test.js \
            src/features/ticket-generator/lib/smartReportParser.test.js \
            src/features/ticket-generator/lib/reportTextAdapter.test.js \
            src/features/ticket-generator/pages/TicketGeneratorImpactBuilder.test.jsx \
            src/features/ticket-generator/pages/TicketGeneratorPage.test.jsx
      - name: Commit validated formatting only
        shell: bash
        run: |
          git add -- \
            src/features/ticket-generator/components/ImpactBuilder.jsx \
            src/features/ticket-generator/components/ProgressComposer.jsx \
            src/features/ticket-generator/components/ProgressComposer.test.jsx \
            src/features/ticket-generator/lib/impactCandidates.test.js \
            src/features/ticket-generator/lib/progressSnippets.js \
            src/features/ticket-generator/lib/progressSnippets.test.js
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(generator): persist GEN-F3 validated formatting"
          git push origin HEAD:feature/template-generator-features
