name: GEN-F5 page wiring

on:
  workflow_dispatch:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f5-wire-page.yml
      - .github/scripts/gen-f5-wire-page.py

permissions:
  contents: write

jobs:
  wire-gen-f5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply guarded page patch
        run: python .github/scripts/gen-f5-wire-page.py
      - name: Format source
        run: npm run format
      - name: Focused GEN-F5 tests
        run: |
          npx vitest run \
            src/features/ticket-generator/lib/duplicateDetection.test.js \
            src/features/ticket-generator/components/DuplicateRelatedPanel.test.jsx \
            src/features/ticket-generator/lib/validationCenter.test.js \
            src/features/ticket-generator/pages/TicketGeneratorPage.test.jsx
      - name: Full unit and component suite
        run: npm test
      - name: Commit validated GEN-F5 wiring
        shell: bash
        run: |
          git add -- \
            src/features/ticket-generator/pages/TicketGeneratorPage.jsx \
            src/features/ticket-generator/lib/duplicateDetection.js \
            src/features/ticket-generator/lib/duplicateDetection.test.js \
            src/features/ticket-generator/lib/duplicateDetectionService.js \
            src/features/ticket-generator/lib/relatedTicketsService.js \
            src/features/ticket-generator/components/DuplicateRelatedPanel.jsx \
            src/features/ticket-generator/components/DuplicateRelatedPanel.test.jsx \
            src/infrastructure/firebase/firestoreTicketQueries.js \
            src/infrastructure/firebase/firestoreTicketRepository.js \
            src/infrastructure/firebase/firestoreIncidentGroups.js \
            src/infrastructure/firebase/firestoreIncidentGroups.emulator.test.js \
            src/infrastructure/firebase/firestoreIncidentGroups.rules.emulator.test.js \
            firestore.indexes.json \
            firestore.rules
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(generator): integrate GEN-F5 duplicate and related Tickets"
          git push origin HEAD:feature/template-generator-features
