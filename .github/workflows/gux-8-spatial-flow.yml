name: GUX-8 spatial flow verification

# Verification attempt 2

on:
  push:
    branches:
      - feature/template-generator-visual-overhaul
    paths:
      - .github/workflows/gux-8-spatial-flow.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-visual-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install browser QA dependencies
        run: >-
          npm install --no-save --package-lock=false
          @playwright/test@1.62.1
          @axe-core/playwright@4.13.0
          cfb@1.2.2

      - name: Verify formatting
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Full unit and component suite
        run: npm test

      - name: Firebase Emulator repository and Security Rules matrix
        run: npm run test:firebase:emulator

      - name: Release preflight
        run: npm run release:preflight

      - name: Generic production build
        run: npm run build

      - name: Firebase-configured production build
        run: npm run build:production

      - name: Dev server smoke
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/nocreport-gux8-vite.log 2>&1 &
          GUX8_VITE_PID=$!
          trap 'kill "$GUX8_VITE_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ > /tmp/nocreport-gux8-index.html; then
              exit 0
            fi
            sleep 1
          done

          sed -n '1,240p' /tmp/nocreport-gux8-vite.log
          exit 1

      - name: Canonical responsive and touch browser matrix
        run: node scripts/t6-browser-qa.mjs

      - name: Prepare pinned Outlook msg runtime fixtures
        shell: bash
        run: |
          set -euo pipefail
          GUX8_UPSTREAM_ROOT="${RUNNER_TEMP}/gux8-msgreader-upstream"
          GUX8_FIXTURE_ROOT="${RUNNER_TEMP}/gux8-msg-fixtures"
          mkdir -p "$GUX8_UPSTREAM_ROOT" "$GUX8_FIXTURE_ROOT"
          git -C "$GUX8_UPSTREAM_ROOT" init
          git -C "$GUX8_UPSTREAM_ROOT" remote add origin https://github.com/HiraokaHyperTools/msgreader-web-ng.git
          git -C "$GUX8_UPSTREAM_ROOT" fetch --depth 1 origin 62c45222668fdc631a33e2fbbb596dd1d6ab770c
          git -C "$GUX8_UPSTREAM_ROOT" checkout FETCH_HEAD -- test/sent.msg
          node scripts/prepare-gen-f9-msg-fixtures.mjs "$GUX8_UPSTREAM_ROOT" "$GUX8_FIXTURE_ROOT"
          echo "GEN_F9_MSG_EXPECTED=$GUX8_FIXTURE_ROOT/expected.json" >> "$GITHUB_ENV"

      - name: Full authenticated Playwright matrix
        run: node scripts/test-t7-e2e.mjs
