name: GEN-F7 contracts QA

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f7-contracts-qa.yml

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format GEN-F7 contracts
        run: |
          npx prettier --write \
            src/features/ticket-generator/lib/handoverSummary.js \
            src/features/ticket-generator/lib/handoverSummary.test.js \
            src/features/ticket-generator/lib/copyCenter.js \
            src/features/ticket-generator/lib/copyCenter.test.js \
            src/features/ticket-generator/lib/operatorPresets.js \
            src/features/ticket-generator/lib/operatorPresets.test.js
      - name: Focused GEN-F7 contract tests
        run: |
          npx vitest run \
            src/features/ticket-generator/lib/handoverSummary.test.js \
            src/features/ticket-generator/lib/copyCenter.test.js \
            src/features/ticket-generator/lib/operatorPresets.test.js
      - name: Persist formatting if needed
        run: |
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/ticket-generator/lib/handoverSummary.js src/features/ticket-generator/lib/handoverSummary.test.js src/features/ticket-generator/lib/copyCenter.js src/features/ticket-generator/lib/copyCenter.test.js src/features/ticket-generator/lib/operatorPresets.js src/features/ticket-generator/lib/operatorPresets.test.js
            git commit -m "style(generator): format GEN-F7 contracts"
            git push origin HEAD:feature/template-generator-features
          fi
