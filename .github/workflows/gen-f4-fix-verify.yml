name: GEN-F4 fix verify

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f4-fix-verify.yml

permissions:
  contents: read

jobs:
  verify-loop-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify isolated regression
        run: npx vitest run src/features/ticket-generator/components/SmartPasteParser.validation.test.jsx --maxWorkers=1 --reporter=verbose
      - name: Verify full unit suite
        run: npm test
