name: GUX-1 import readiness intelligence

on:
  push:
    branches:
      - feature/template-generator-visual-overhaul
    paths:
      - .github/workflows/gux-1-intelligence.yml

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-visual-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply GUX-1 presentation changes
        run: node scripts/apply-gux-1-intelligence.mjs apply

      - name: Format
        run: npm run format

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Targeted import and readiness regression
        run: >-
          npx vitest run
          src/features/ticket-generator/components/SmartPasteParser.validation.test.jsx
          src/features/ticket-generator/components/ValidationCenter.test.jsx
          src/features/ticket-generator/components/ValidationCenterDuplicateGate.test.jsx
          src/features/ticket-generator/components/DuplicateRelatedPanel.test.jsx

      - name: Full unit and component suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Record GUX-1 evidence
        run: node scripts/apply-gux-1-intelligence.mjs record

      - name: Commit validated GUX-1 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/ticket-generator/components/SmartPasteParser.jsx \
            src/features/ticket-generator/components/ValidationCenter.jsx \
            src/features/ticket-generator/components/DuplicateRelatedPanel.jsx \
            src/styles/app.css \
            docs/08-post-mvp/TEMPLATE-GENERATOR-VISUAL-OVERHAUL-TRACKER.md
          git commit -m 'feat(generator-ui): complete GUX-1 intelligence hierarchy'
          git push origin HEAD:feature/template-generator-visual-overhaul
