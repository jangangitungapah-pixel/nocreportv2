name: GEN-F9 tracker automated evidence

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f9-tracker-evidence.yml

permissions:
  contents: write

jobs:
  record-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Record GEN-F9 automated gates only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/08-post-mvp/TEMPLATE-GENERATOR-IMPLEMENTATION-TRACKER.md';
          let text = fs.readFileSync(path, 'utf8');

          const automatedItems = [
            'Prettier + committed-format verification.',
            'ESLint.',
            'Run all unit/component tests.',
            'Run Firebase Emulator repository tests.',
            'Run Firestore Security Rules matrix.',
            'Run dependency/security/legacy hygiene.',
            'Run release preflight.',
            'Run generic production build.',
            'Run Firebase-configured production build.',
            'Run real-browser responsive/touch matrix.',
            'Validate Admin lifecycle E2E.',
            'Validate Operator/Viewer RBAC E2E.',
            'Add `.msg` import E2E with a sanitized fixture.',
            'Add Sent Time → Dispatch Time E2E.',
            'Add quoted `Sent:` rejection E2E.',
            'Add selective overwrite-safety E2E.',
            'Add multi-endpoint path E2E.',
            'Add duplicate detection E2E.',
            'Add draft restore E2E.',
            'Add revision diff E2E.',
            'Validate keyboard shortcut E2E.',
            'Validate Light/Dark serious/critical axe.',
            'Validate mobile no-horizontal-overflow.',
          ];

          for (const item of automatedItems) {
            const pending = `- [ ] ${item}`;
            const done = `- [x] ${item}`;
            if (!text.includes(pending) && !text.includes(done)) {
              throw new Error(`GEN-F9 tracker item not found: ${item}`);
            }
            text = text.replace(pending, done);
          }

          const evidenceHeading = '### GEN-F9 automated QA evidence';
          if (!text.includes(evidenceHeading)) {
            const exitHeading = '### GEN-F9 exit criterion';
            if (!text.includes(exitHeading)) {
              throw new Error('GEN-F9 exit criterion marker not found.');
            }
            const evidence = `${evidenceHeading}\n\n` +
              '**Focused GEN-F9 browser QA — GREEN.** Workflow run ID `33010779128`, successful attempt 5, validated the runtime Outlook `.msg` path plus current-message Sent metadata authority / quoted `Sent:` rejection, selective dirty-field overwrite safety, three-endpoint import, bounded duplicate advisory with explicit Create anyway, Draft Recovery, revision diff/audit history, and Generator `Ctrl+S`. Result: **7/7 passed**. The phase-only focused workflow was removed after success.\n\n' +
              '**Quality #807 — FULL GREEN** on automated-gate head `6bd6485ebf8c19e7aa6ab419b6f2e5965bd764bb` (run ID `33013473856`). Validated committed Prettier formatting, ESLint, full unit/component suite, Firebase Emulator repository integration, Firestore Security Rules coverage, dependency/security/legacy hygiene, release preflight, generic and Firebase-configured production builds, dev smoke, real-browser responsive/touch QA, canonical Admin lifecycle and Operator/Viewer RBAC Playwright coverage, Light/Dark accessibility checks, mobile overflow coverage, and the final committed-format verifier.\n\n' +
              'Automated GEN-F9 hardening is green. **Human NOC workflow acceptance remains outstanding and is intentionally not inferred or fabricated.** GEN-F9 stays IN PROGRESS until the user explicitly provides that acceptance; final release evidence/closeout also remains pending until then.\n\n';
            text = text.replace(exitHeading, `${evidence}${exitHeading}`);
          }

          fs.writeFileSync(path, text);
          NODE

      - name: Commit tracker evidence
        shell: bash
        run: |
          TRACKER='docs/08-post-mvp/TEMPLATE-GENERATOR-IMPLEMENTATION-TRACKER.md'
          if git diff --quiet -- "$TRACKER"; then
            echo 'Tracker already contains the automated evidence.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TRACKER"
          git commit -m 'docs(generator): record GEN-F9 automated gate evidence'
          git push origin HEAD:feature/template-generator-features
