name: GUX-5 responsive mobile workspace

on:
  push:
    branches:
      - feature/template-generator-visual-overhaul
    paths:
      - .github/workflows/gux-5-mobile.yml

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-visual-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install browser QA dependency
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Apply GUX-5 mobile presentation changes
        run: node scripts/apply-gux-5-mobile.mjs apply

      - name: Contain mobile cockpit ambience
        run: node scripts/fix-gux-5-mobile-ambient-overflow.mjs

      - name: Enforce mobile command touch targets
        run: node scripts/fix-gux-5-mobile-touch.mjs

      - name: Normalize GUX-5 browser lint
        run: node scripts/fix-gux-5-mobile-lint.mjs

      - name: Add hardened mobile overflow diagnostics
        run: node scripts/diagnose-gux-5-mobile-overflow.mjs

      - name: Format
        run: npm run format

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Targeted Generator regression
        run: >-
          npx vitest run
          src/features/ticket-generator/pages/TicketGeneratorPage.test.jsx
          src/features/ticket-generator/components/CopyCenter.test.jsx
          src/features/ticket-generator/components/ProgressComposer.test.jsx
          src/features/ticket-generator/components/OperatorPresetsPanel.test.jsx

      - name: Full unit and component suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Authenticated mobile Chromium matrix
        env:
          VITE_FIREBASE_API_KEY: demo-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-nocreport.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-nocreport
          VITE_FIREBASE_APP_ID: 1:123456789:web:gux5-mobile
          VITE_USE_FIREBASE_EMULATORS: 'true'
          VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1
          VITE_FIRESTORE_EMULATOR_PORT: '8080'
          VITE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
        shell: bash
        run: |
          npx --yes firebase-tools@15.27.0 emulators:exec \
            --project demo-nocreport \
            --only auth,firestore \
            "npx playwright test e2e/gux-5-mobile.spec.js --config playwright.config.js"

      - name: Record GUX-5 evidence
        run: node scripts/apply-gux-5-mobile.mjs record

      - name: Commit validated GUX-5 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/ticket-generator/pages/TicketGeneratorPage.jsx \
            src/styles/app.css \
            e2e/gux-5-mobile.spec.js \
            docs/08-post-mvp/TEMPLATE-GENERATOR-VISUAL-OVERHAUL-TRACKER.md
          git commit -m 'feat(generator-ui): complete GUX-5 responsive mobile workspace'
          git push origin HEAD:feature/template-generator-visual-overhaul
