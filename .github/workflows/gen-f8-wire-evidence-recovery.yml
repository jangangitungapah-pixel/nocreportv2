name: GEN-F8 evidence recovery wiring

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f8-wire-evidence-recovery.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply guarded recovery patch
        run: python3 .github/scripts/gen-f8-wire-evidence-recovery.py
      - name: Format recovery files
        run: npx prettier --write src/features/ticket-generator/lib/draftRecovery.js src/features/ticket-generator/lib/draftRecoveryEvidence.test.js
      - name: Run recovery privacy regressions
        run: npx vitest run src/features/ticket-generator/lib/evidenceWorkspace.test.js src/features/ticket-generator/lib/draftRecovery.test.js src/features/ticket-generator/lib/draftRecoveryEvidence.test.js
      - name: Commit validated recovery wiring
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ticket-generator/lib/draftRecovery.js src/features/ticket-generator/lib/draftRecoveryEvidence.test.js
          git commit -m "feat(generator): recover safe evidence metadata"
          git push origin HEAD:feature/template-generator-features
