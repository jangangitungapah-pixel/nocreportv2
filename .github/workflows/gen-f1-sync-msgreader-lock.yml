name: GEN-F1 Sync msgreader lock

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f1-sync-msgreader-lock.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Generate exact lockfile entry
        run: npm install --package-lock-only --ignore-scripts --save-exact @kenjiuno/msgreader-web-ng@0.2.0-alpha1

      - name: Verify exact dependency pin
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies['@kenjiuno/msgreader-web-ng']!=='0.2.0-alpha1') process.exit(1)"
          node -e "const p=require('./package-lock.json'); const e=p.packages['node_modules/@kenjiuno/msgreader-web-ng']; if(!e || e.version!=='0.2.0-alpha1') process.exit(1)"

      - name: Persist generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build(generator): sync Outlook decoder lockfile"
          git push origin HEAD:feature/template-generator-features
