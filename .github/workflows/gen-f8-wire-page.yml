name: GEN-F8 page wiring

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f8-wire-page.yml

permissions:
  contents: write

jobs:
  wire-page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply guarded GEN-F8 page wiring
        run: python .github/scripts/gen-f8-wire-page.py
      - name: Format GEN-F8 integration files
        run: npx prettier --write src/features/ticket-generator/pages/TicketGeneratorPage.jsx src/features/ticket-generator/pages/TicketGeneratorEvidenceRecovery.test.jsx
      - name: Run focused GEN-F8 integration regressions
        run: >-
          npx vitest run
          src/features/ticket-generator/pages/TicketGeneratorEvidenceRecovery.test.jsx
          src/features/ticket-generator/components/EvidenceWorkspace.test.jsx
          src/features/ticket-generator/lib/evidenceWorkspace.test.js
          src/features/ticket-generator/lib/draftRecoveryEvidence.test.js
      - name: Commit validated GEN-F8 page wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ticket-generator/pages/TicketGeneratorPage.jsx src/features/ticket-generator/pages/TicketGeneratorEvidenceRecovery.test.jsx
          git commit -m "feat(generator): wire GEN-F8 evidence workspace recovery"
          git push origin HEAD:feature/template-generator-features
