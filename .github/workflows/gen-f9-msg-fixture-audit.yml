name: GEN-F9 MSG fixture audit

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f9-msg-fixture-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Inspect pinned decoder package metadata and packaged fixtures
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const pkgPath = require.resolve('@kenjiuno/msgreader-web-ng/package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          console.log('PACKAGE_JSON=' + pkgPath);
          console.log('PACKAGE_NAME=' + pkg.name);
          console.log('PACKAGE_VERSION=' + pkg.version);
          console.log('PACKAGE_REPOSITORY=' + JSON.stringify(pkg.repository ?? null));
          const root = path.dirname(pkgPath);
          const found = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.toLowerCase().endsWith('.msg')) found.push(full);
            }
          }
          walk(root);
          console.log('PACKAGED_MSG_FIXTURES=' + JSON.stringify(found));
          NODE
      - name: Clone declared upstream repository and list MSG fixtures
        run: |
          REPO_URL=$(node - <<'NODE'
          const fs = require('node:fs');
          const pkgPath = require.resolve('@kenjiuno/msgreader-web-ng/package.json');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const repository = typeof pkg.repository === 'string' ? pkg.repository : pkg.repository?.url;
          if (!repository) process.exit(2);
          process.stdout.write(repository.replace(/^git\+/, '').replace(/^git:/, 'https:').replace(/\.git$/, '') + '.git');
          NODE
          )
          echo "UPSTREAM_REPOSITORY=$REPO_URL"
          git clone --depth 1 "$REPO_URL" /tmp/msgreader-upstream
          find /tmp/msgreader-upstream -type f -iname '*.msg' -printf '%P\n' | sort | tee /tmp/msg-fixtures.txt
          test -s /tmp/msg-fixtures.txt
