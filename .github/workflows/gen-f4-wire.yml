name: GEN-F4 validation wiring

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f4-wire.yml

permissions:
  contents: write

jobs:
  wire-gen-f4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Patch audited GEN-F4 wiring anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}')
              path.write_text(text.replace(old, new, 1))

          smart = Path('src/features/ticket-generator/components/SmartPasteParser.jsx')
          replace_once(
              smart,
              "  metadataPresent = false,\n}) {",
              "  metadataPresent = false,\n  onAnalysisChange,\n}) {",
          )
          replace_once(
              smart,
              "  const titleBlockedByIdentity = Boolean(\n    blockingIdentityConflict && (!chosenIdentity || chosenIdentity.source !== 'subject'),\n  );\n\n  useEffect(() => {",
              "  const titleBlockedByIdentity = Boolean(\n    blockingIdentityConflict && (!chosenIdentity || chosenIdentity.source !== 'subject'),\n  );\n\n  useEffect(() => {\n    onAnalysisChange?.(candidate ? { candidate, identityResolution: chosenIdentity } : null);\n  }, [candidate, chosenIdentity, onAnalysisChange]);\n\n  useEffect(() => {",
          )

          page = Path('src/features/ticket-generator/pages/TicketGeneratorPage.jsx')
          replace_once(
              page,
              "import { SmartPasteParser } from '../components/SmartPasteParser.jsx';",
              "import { SmartPasteParser } from '../components/SmartPasteParser.jsx';\nimport { ValidationCenter } from '../components/ValidationCenter.jsx';",
          )
          replace_once(
              page,
              "import { ticketToFormValues } from '../lib/ticketToForm.js';\nimport { ticketFormSchema } from '../schemas/ticketFormSchema.js';",
              "import { ticketToFormValues } from '../lib/ticketToForm.js';\nimport { TIME_INTELLIGENCE_REFRESH_MS } from '../lib/timeIntelligence.js';\nimport { deriveReportValidation } from '../lib/validationCenter.js';\nimport { ticketFormSchema } from '../schemas/ticketFormSchema.js';",
          )
          replace_once(
              page,
              "  const [featureMetadataDirty, setFeatureMetadataDirty] = useState(false);",
              "  const [featureMetadataDirty, setFeatureMetadataDirty] = useState(false);\n  const [importReview, setImportReview] = useState(null);\n  const [validationNow, setValidationNow] = useState(() => new Date());",
          )
          replace_once(
              page,
              "  const report = useMemo(() => formatTicketReport(ticket), [ticket]);\n  const coordinate = coordinateSummary(watchedValues?.latitude, watchedValues?.longitude);",
              "  const report = useMemo(() => formatTicketReport(ticket), [ticket]);\n  const validation = useMemo(\n    () =>\n      deriveReportValidation(ticket, {\n        formValues: watchedValues,\n        importCandidate: importReview?.candidate ?? null,\n        resolvedPrimaryIdentity: Boolean(importReview?.identityResolution),\n        now: validationNow,\n        timezone: 'Asia/Jakarta',\n      }),\n    [importReview, ticket, validationNow, watchedValues],\n  );\n  const coordinate = coordinateSummary(watchedValues?.latitude, watchedValues?.longitude);",
          )
          replace_once(
              page,
              "  useEffect(() => {\n    loadPersistedEditor();\n  }, [loadPersistedEditor]);",
              "  useEffect(() => {\n    loadPersistedEditor();\n  }, [loadPersistedEditor]);\n\n  useEffect(() => {\n    const timer = window.setInterval(() => setValidationNow(new Date()), TIME_INTELLIGENCE_REFRESH_MS);\n    return () => window.clearInterval(timer);\n  }, []);",
          )
          replace_once(
              page,
              "    if (localDevelopmentMode || !routeTicketId) {\n      setLoadingTicket(false);\n      setLoadError(null);\n      return;\n    }",
              "    if (localDevelopmentMode || !routeTicketId) {\n      setLoadingTicket(false);\n      setLoadError(null);\n      if (!routeTicketId) setImportReview(null);\n      return;\n    }",
          )
          replace_once(
              page,
              "      setFeatureMetadata(createEditorFeatureMetadata(loaded.ticket));\n      setFeatureMetadataDirty(false);\n      setPersistedCoordinateSignature(loaded.coordinateSignature);",
              "      setFeatureMetadata(createEditorFeatureMetadata(loaded.ticket));\n      setFeatureMetadataDirty(false);\n      setImportReview(null);\n      setPersistedCoordinateSignature(loaded.coordinateSignature);",
          )
          replace_once(
              page,
              "  const titleRegistration = register('title');",
              "  const focusValidationField = (field) => {\n    const fieldIds = {\n      title: 'ticket-title',\n      occurAt: 'occur-at',\n      dispatchAt: 'dispatch-at',\n      pic: 'pic',\n      rootcause: 'rootcause',\n      cutPoint: 'cut-point',\n      latitude: 'latitude',\n      longitude: 'longitude',\n      progress: 'progress-text',\n    };\n    const target = fieldIds[field] ? document.getElementById(fieldIds[field]) : null;\n    if (target) {\n      target.scrollIntoView?.({ block: 'center', behavior: 'smooth' });\n      target.focus?.();\n      return;\n    }\n    const section =\n      field === 'impactList'\n        ? document.querySelector('.generator-impact-editor')\n        : field === 'description'\n          ? document.querySelector('.generator-smart-import')\n          : null;\n    section?.scrollIntoView?.({ block: 'center', behavior: 'smooth' });\n  };\n\n  const titleRegistration = register('title');",
          )
          replace_once(
              page,
              "          metadataPresent={hasStructuredMetadata}\n        />",
              "          metadataPresent={hasStructuredMetadata}\n          onAnalysisChange={setImportReview}\n        />",
          )
          replace_once(
              page,
              "      ) : null}\n\n      <form\n        id=\"ticket-editor-form\"",
              "      ) : null}\n\n      <ValidationCenter validation={validation} onFocusField={focusValidationField} />\n\n      <form\n        id=\"ticket-editor-form\"",
          )
          PY
      - name: Format GEN-F4 wiring
        run: npm run format
      - name: Run focused GEN-F4 regression matrix
        run: |
          npx vitest run \
            src/features/ticket-generator/lib/timeIntelligence.test.js \
            src/features/ticket-generator/lib/validationCenter.test.js \
            src/features/ticket-generator/pages/TicketGeneratorPage.test.jsx \
            src/features/ticket-generator/pages/TicketGeneratorSmartTitle.test.jsx
      - name: Commit validated wiring
        shell: bash
        run: |
          git add -- \
            src/features/ticket-generator/components/SmartPasteParser.jsx \
            src/features/ticket-generator/pages/TicketGeneratorPage.jsx \
            src/features/ticket-generator/lib/timeIntelligence.js \
            src/features/ticket-generator/lib/timeIntelligence.test.js \
            src/features/ticket-generator/lib/validationCenter.js \
            src/features/ticket-generator/lib/validationCenter.test.js \
            src/features/ticket-generator/components/ValidationCenter.jsx
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(generator): wire GEN-F4 validation and time intelligence"
          git push origin HEAD:feature/template-generator-features
