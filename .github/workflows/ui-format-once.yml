name: UI Format Once

on:
  push:
    branches:
      - feature/ui-overhaul-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format UI overhaul source
        run: npm run format

      - name: Persist exact formatter output
        shell: bash
        run: |
          if git diff --quiet -- \
            src \
            e2e \
            scripts \
            index.html \
            package.json \
            playwright.config.js \
            eslint.config.js \
            vite.config.js \
            vitest.config.js; then
            echo "No formatter changes to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src \
            e2e \
            scripts \
            index.html \
            package.json \
            playwright.config.js \
            eslint.config.js \
            vite.config.js \
            vitest.config.js
          git commit -m "chore(ui): persist exact Prettier output"
          git push
