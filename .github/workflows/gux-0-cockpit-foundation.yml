name: GUX-0 cockpit foundation

on:
  push:
    branches:
      - feature/template-generator-visual-overhaul
    paths:
      - .github/workflows/gux-0-cockpit-foundation.yml

permissions:
  contents: write

jobs:
  cockpit-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-visual-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply GUX-0 presentation foundation
        run: node scripts/apply-gux-0-cockpit.mjs apply

      - name: Format
        run: npm run format

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Record GUX-0 evidence
        run: node scripts/apply-gux-0-cockpit.mjs record

      - name: Commit validated GUX-0 foundation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/ticket-generator/pages/TicketGeneratorPage.jsx \
            src/styles/app.css \
            docs/08-post-mvp/TEMPLATE-GENERATOR-VISUAL-OVERHAUL-TRACKER.md
          git commit -m 'feat(generator-ui): establish GUX-0 cockpit foundation'
          git push origin HEAD:feature/template-generator-visual-overhaul
