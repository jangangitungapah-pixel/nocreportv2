name: GEN-F4 render loop fix

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f4-render-loop-fix.yml

permissions:
  contents: write

jobs:
  fix-render-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Patch stable empty defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/ticket-generator/components/SmartPasteParser.jsx')
          text = path.read_text()

          old = "const FIELD_LABELS = {"
          new = "const EMPTY_VALUES = Object.freeze({});\n\nconst FIELD_LABELS = {"
          if text.count(old) != 1:
              raise SystemExit(f'expected one FIELD_LABELS anchor, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "  currentValues = {},\n  dirtyFields = {},"
          new = "  currentValues = EMPTY_VALUES,\n  dirtyFields = EMPTY_VALUES,"
          if text.count(old) != 1:
              raise SystemExit(f'expected one default-props anchor, got {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Format patched source
        run: npx prettier --write src/features/ticket-generator/components/SmartPasteParser.jsx
      - name: Verify isolated regression
        run: npx vitest run src/features/ticket-generator/components/SmartPasteParser.validation.test.jsx --maxWorkers=1 --reporter=verbose
      - name: Verify full unit and component suite
        run: npm test -- --run
      - name: Commit validated source fix
        shell: bash
        run: |
          git add -- src/features/ticket-generator/components/SmartPasteParser.jsx
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(generator): stabilize Unified Import analysis defaults"
          git push origin HEAD:feature/template-generator-features
