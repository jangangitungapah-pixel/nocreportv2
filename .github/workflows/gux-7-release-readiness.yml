name: GUX-7 integrated release readiness

on:
  push:
    branches:
      - feature/template-generator-visual-overhaul
    paths:
      - .github/workflows/gux-7-release-readiness.yml

permissions:
  contents: write

jobs:
  release-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-visual-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install browser accessibility dependencies
        run: >-
          npm install --no-save --package-lock=false
          @playwright/test@1.62.1
          @axe-core/playwright@4.13.0

      - name: Format source
        run: npm run format

      - name: Prettier check
        run: npm run format:check

      - name: Verify committed source formatting
        shell: bash
        run: |
          git diff --exit-code -- \
            src \
            e2e \
            scripts \
            index.html \
            package.json \
            playwright.config.js \
            eslint.config.js \
            vite.config.js \
            vitest.config.js

      - name: ESLint
        run: npm run lint

      - name: Full unit and component suite
        run: npm test

      - name: Firebase Emulator repository and Security Rules matrix
        run: npm run test:firebase:emulator

      - name: Dependency and security hygiene
        run: node scripts/t7-security-hygiene.mjs

      - name: Release preflight
        run: npm run release:preflight

      - name: Generic production build
        run: npm run build

      - name: Firebase-configured production build
        run: npm run build:production

      - name: Dev server smoke
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/nocreport-gux7-vite.log 2>&1 &
          GUX7_VITE_PID=$!
          trap 'kill "$GUX7_VITE_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ > /tmp/nocreport-gux7-index.html; then
              exit 0
            fi
            sleep 1
          done

          sed -n '1,240p' /tmp/nocreport-gux7-vite.log
          exit 1

      - name: Canonical responsive and touch browser matrix
        run: node scripts/t6-browser-qa.mjs

      - name: Prepare pinned Outlook msg runtime fixtures
        shell: bash
        run: |
          set -euo pipefail
          GUX7_UPSTREAM_ROOT="${RUNNER_TEMP}/gux7-msgreader-upstream"
          GUX7_FIXTURE_ROOT="${RUNNER_TEMP}/gux7-msg-fixtures"
          mkdir -p "$GUX7_UPSTREAM_ROOT" "$GUX7_FIXTURE_ROOT"
          git -C "$GUX7_UPSTREAM_ROOT" init
          git -C "$GUX7_UPSTREAM_ROOT" remote add origin https://github.com/HiraokaHyperTools/msgreader-web-ng.git
          git -C "$GUX7_UPSTREAM_ROOT" fetch --depth 1 origin 62c45222668fdc631a33e2fbbb596dd1d6ab770c
          git -C "$GUX7_UPSTREAM_ROOT" checkout FETCH_HEAD -- test/sent.msg
          node scripts/prepare-gen-f9-msg-fixtures.mjs "$GUX7_UPSTREAM_ROOT" "$GUX7_FIXTURE_ROOT"
          echo "GEN_F9_MSG_EXPECTED=$GUX7_FIXTURE_ROOT/expected.json" >> "$GITHUB_ENV"

      - name: Full authenticated Playwright release matrix
        run: node scripts/test-t7-e2e.mjs

      - name: Record GUX-7 automated evidence
        run: node scripts/record-gux-7-readiness.js

      - name: Commit validated GUX-7 tracker evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/08-post-mvp/TEMPLATE-GENERATOR-VISUAL-OVERHAUL-TRACKER.md
          git commit -m 'test(generator-ui): record GUX-7 automated readiness'
          git push origin HEAD:feature/template-generator-visual-overhaul
