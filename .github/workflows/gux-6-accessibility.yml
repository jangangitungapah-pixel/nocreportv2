name: GUX-6 theme motion accessibility

on:
  push:
    branches:
      - feature/template-generator-visual-overhaul
    paths:
      - .github/workflows/gux-6-accessibility.yml

permissions:
  contents: write

jobs:
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-visual-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install browser accessibility dependencies
        run: >-
          npm install --no-save --package-lock=false
          @playwright/test@1.62.1
          @axe-core/playwright@4.13.0

      - name: Apply GUX-6 accessibility changes
        run: node scripts/apply-gux-6-accessibility.mjs apply

      - name: Format
        run: npm run format

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Targeted Generator accessibility regression
        run: >-
          npx vitest run
          src/features/ticket-generator/pages/TicketGeneratorPage.test.jsx
          src/features/ticket-generator/components/ValidationCenter.test.jsx
          src/features/ticket-generator/components/ValidationCenterDuplicateGate.test.jsx

      - name: Full unit and component suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Authenticated Light Dark keyboard motion axe gate
        env:
          VITE_FIREBASE_API_KEY: demo-api-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-nocreport.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-nocreport
          VITE_FIREBASE_APP_ID: 1:123456789:web:gux6-accessibility
          VITE_USE_FIREBASE_EMULATORS: 'true'
          VITE_FIRESTORE_EMULATOR_HOST: 127.0.0.1
          VITE_FIRESTORE_EMULATOR_PORT: '8080'
          VITE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
        shell: bash
        run: |
          npx --yes firebase-tools@15.27.0 emulators:exec \
            --project demo-nocreport \
            --only auth,firestore \
            "npx playwright test e2e/gux-6-accessibility.spec.js --config playwright.config.js"

      - name: Record GUX-6 evidence
        run: node scripts/apply-gux-6-accessibility.mjs record

      - name: Commit validated GUX-6 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/ticket-generator/pages/TicketGeneratorPage.jsx \
            src/features/ticket-generator/components/ValidationCenter.jsx \
            src/styles/tokens.css \
            src/styles/app.css \
            e2e/gux-6-accessibility.spec.js \
            docs/08-post-mvp/TEMPLATE-GENERATOR-VISUAL-OVERHAUL-TRACKER.md
          git commit -m 'feat(generator-ui): complete GUX-6 accessibility polish'
          git push origin HEAD:feature/template-generator-visual-overhaul

