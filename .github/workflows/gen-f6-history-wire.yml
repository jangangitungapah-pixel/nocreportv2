name: GEN-F6 history wire

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f6-history-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Patch GEN-F6 history wiring
        run: |
          python3 <<'PY'
          from pathlib import Path

          page = Path('src/features/ticket-generator/pages/TicketGeneratorPage.jsx')
          p = page.read_text()

          ticket_import = """} from '../../../entities/ticket/index.js';\nimport { AppIcon }"""
          ticket_new = """} from '../../../entities/ticket/index.js';\nimport { CAPABILITY } from '../../../entities/user/authorization.js';\nimport { AppIcon }"""
          if ticket_import not in p:
              raise SystemExit('user capability import anchor missing')
          p = p.replace(ticket_import, ticket_new, 1)

          panel_import = """import { ReportPreview } from '../components/ReportPreview.jsx';\nimport { SmartPasteParser }"""
          panel_new = """import { ReportPreview } from '../components/ReportPreview.jsx';\nimport { RevisionHistoryPanel } from '../components/RevisionHistoryPanel.jsx';\nimport { SmartPasteParser }"""
          if panel_import not in p:
              raise SystemExit('history panel import anchor missing')
          p = p.replace(panel_import, panel_new, 1)

          service_import = """  createTicketEditor,\n  loadTicketEditor,\n  persistProgressAppend,"""
          service_new = """  createTicketEditor,\n  loadTicketEditor,\n  loadTicketRevisionHistory,\n  persistProgressAppend,"""
          if service_import not in p:
              raise SystemExit('history service import anchor missing')
          p = p.replace(service_import, service_new, 1)

          auth_anchor = """  const { ticketId: routeTicketId } = useParams();\n  const { localDevelopmentMode } = useAuth();\n  const { pushToast } = useToast();"""
          auth_new = """  const { ticketId: routeTicketId } = useParams();\n  const { localDevelopmentMode, can } = useAuth();\n  const canReadAudit = can?.(CAPABILITY.READ_AUDIT) ?? false;\n  const { pushToast } = useToast();"""
          if auth_anchor not in p:
              raise SystemExit('auth anchor missing')
          p = p.replace(auth_anchor, auth_new, 1)

          state_anchor = """  const [progressRecoveryDraft, setProgressRecoveryDraft] = useState(null);"""
          state_new = """  const [progressRecoveryDraft, setProgressRecoveryDraft] = useState(null);\n  const [revisionHistory, setRevisionHistory] = useState([]);\n  const [revisionHistoryLoading, setRevisionHistoryLoading] = useState(false);\n  const [revisionHistoryError, setRevisionHistoryError] = useState(null);"""
          if state_anchor not in p:
              raise SystemExit('history state anchor missing')
          p = p.replace(state_anchor, state_new, 1)

          load_effect_anchor = """  useEffect(() => {\n    loadPersistedEditor();\n  }, [loadPersistedEditor]);\n"""
          history_effect = load_effect_anchor + """\n  useEffect(() => {\n    let cancelled = false;\n\n    if (!routeTicketId || revision <= 0 || localDevelopmentMode || !canReadAudit) {\n      setRevisionHistory([]);\n      setRevisionHistoryError(null);\n      setRevisionHistoryLoading(false);\n      return undefined;\n    }\n\n    setRevisionHistoryLoading(true);\n    setRevisionHistoryError(null);\n    void loadTicketRevisionHistory(routeTicketId, { limit: 50 })\n      .then((events) => {\n        if (!cancelled) setRevisionHistory(events);\n      })\n      .catch((error) => {\n        if (!cancelled) {\n          setRevisionHistory([]);\n          setRevisionHistoryError(error);\n        }\n      })\n      .finally(() => {\n        if (!cancelled) setRevisionHistoryLoading(false);\n      });\n\n    return () => {\n      cancelled = true;\n    };\n  }, [canReadAudit, localDevelopmentMode, revision, routeTicketId]);\n"""
          if load_effect_anchor not in p:
              raise SystemExit('history effect anchor missing')
          p = p.replace(load_effect_anchor, history_effect, 1)

          timeline_anchor = """      <ProgressTimeline\n        entries={progressEntries}\n        onUpdate={updateProgress}\n        onRemove={setRemoveProgressId}\n      />\n    </div>"""
          timeline_new = """      <ProgressTimeline\n        entries={progressEntries}\n        onUpdate={updateProgress}\n        onRemove={setRemoveProgressId}\n      />\n      {routeTicketId && canReadAudit ? (\n        <RevisionHistoryPanel\n          events={revisionHistory}\n          loading={revisionHistoryLoading}\n          error={revisionHistoryError}\n        />\n      ) : null}\n    </div>"""
          if timeline_anchor not in p:
              raise SystemExit('history render anchor missing')
          p = p.replace(timeline_anchor, timeline_new, 1)
          page.write_text(p)

          test = Path('src/features/ticket-generator/pages/TicketGeneratorRevisionHistory.test.jsx')
          test.write_text("""import { cleanup, render, screen, waitFor } from '@testing-library/react';\nimport { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';\nimport { createMemoryRouter, RouterProvider } from 'react-router-dom';\n\nimport { ToastProvider } from '../../../app/providers/ToastProvider.jsx';\nimport { CAPABILITY } from '../../../entities/user/authorization.js';\nimport { createEmptyTicket } from '../../../entities/ticket/index.js';\nimport { TicketGeneratorPage } from './TicketGeneratorPage.jsx';\n\nconst authState = vi.hoisted(() => ({ canReadAudit: true }));\nconst persistenceMocks = vi.hoisted(() => ({\n  loadTicketEditor: vi.fn(),\n  loadTicketRevisionHistory: vi.fn(),\n}));\n\nvi.mock('../../../app/providers/AuthProvider.jsx', async (importOriginal) => ({\n  ...(await importOriginal()),\n  useAuth: () => ({\n    localDevelopmentMode: false,\n    can: (capability) => capability === CAPABILITY.READ_AUDIT && authState.canReadAudit,\n  }),\n}));\n\nvi.mock('../lib/persistenceService.js', async (importOriginal) => ({\n  ...(await importOriginal()),\n  loadTicketEditor: persistenceMocks.loadTicketEditor,\n  loadTicketRevisionHistory: persistenceMocks.loadTicketRevisionHistory,\n}));\n\nfunction renderExistingTicket() {\n  const router = createMemoryRouter(\n    [{ path: '/generator/:ticketId/edit', element: <TicketGeneratorPage /> }],\n    { initialEntries: ['/generator/ticket-1/edit'] },\n  );\n  return render(\n    <ToastProvider>\n      <RouterProvider router={router} />\n    </ToastProvider>,\n  );\n}\n\ndescribe('TicketGenerator Revision History capability gate', () => {\n  beforeEach(() => {\n    window.localStorage.clear();\n    authState.canReadAudit = true;\n    persistenceMocks.loadTicketEditor.mockReset();\n    persistenceMocks.loadTicketRevisionHistory.mockReset();\n    persistenceMocks.loadTicketEditor.mockResolvedValue({\n      ticket: createEmptyTicket({\n        id: 'ticket-1',\n        title: '[MANDAU] LINK DOWN',\n        revision: 4,\n      }),\n      progress: [],\n      coordinateSignature: 'none',\n    });\n    persistenceMocks.loadTicketRevisionHistory.mockResolvedValue([\n      {\n        id: 'audit-1',\n        type: 'TICKET_UPDATED',\n        actorUid: 'admin-1',\n        revisionFrom: 3,\n        revisionTo: 4,\n        createdAt: new Date('2026-08-26T17:00:00.000Z'),\n        details: { changes: { pic: { from: 'A', to: 'B' } } },\n      },\n    ]);\n  });\n\n  afterEach(() => {\n    cleanup();\n    vi.restoreAllMocks();\n  });\n\n  it('loads and renders bounded audit history when READ_AUDIT is granted', async () => {\n    renderExistingTicket();\n\n    await waitFor(() => expect(persistenceMocks.loadTicketEditor).toHaveBeenCalledWith('ticket-1'));\n    await waitFor(() =>\n      expect(persistenceMocks.loadTicketRevisionHistory).toHaveBeenCalledWith('ticket-1', {\n        limit: 50,\n      }),\n    );\n    expect(await screen.findByRole('heading', { name: 'Revision History' })).toBeInTheDocument();\n    expect(screen.getByText(/revision 3 → 4/)).toBeInTheDocument();\n  });\n\n  it('does not query or expose audit history without READ_AUDIT', async () => {\n    authState.canReadAudit = false;\n    renderExistingTicket();\n\n    await waitFor(() => expect(persistenceMocks.loadTicketEditor).toHaveBeenCalledWith('ticket-1'));\n    await waitFor(() => expect(screen.getByRole('heading', { name: 'Edit Ticket' })).toBeInTheDocument());\n    expect(persistenceMocks.loadTicketRevisionHistory).not.toHaveBeenCalled();\n    expect(screen.queryByRole('heading', { name: 'Revision History' })).not.toBeInTheDocument();\n  });\n});\n""")
          PY
      - name: Format history sources
        run: npx prettier --write src/features/ticket-generator/pages/TicketGeneratorPage.jsx src/features/ticket-generator/pages/TicketGeneratorRevisionHistory.test.jsx src/features/ticket-generator/components/RevisionHistoryPanel.jsx src/features/ticket-generator/components/RevisionHistoryPanel.test.jsx src/features/ticket-generator/lib/persistenceService.js src/infrastructure/firebase/firestoreAuditQueries.js src/infrastructure/firebase/firestoreTicketRepository.js
      - name: Focused history tests
        run: npx vitest run src/features/ticket-generator/components/RevisionHistoryPanel.test.jsx src/features/ticket-generator/pages/TicketGeneratorRevisionHistory.test.jsx src/features/ticket-generator/pages/TicketGeneratorPage.test.jsx src/features/ticket-generator/lib/ticketRevisionDiff.test.js src/features/ticket-generator/lib/draftRecovery.test.js
      - name: Commit history wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ticket-generator/pages/TicketGeneratorPage.jsx src/features/ticket-generator/pages/TicketGeneratorRevisionHistory.test.jsx src/features/ticket-generator/components/RevisionHistoryPanel.jsx src/features/ticket-generator/components/RevisionHistoryPanel.test.jsx src/features/ticket-generator/lib/persistenceService.js src/infrastructure/firebase/firestoreAuditQueries.js src/infrastructure/firebase/firestoreTicketRepository.js
          git diff --cached --check
          git commit -m "feat(generator): wire bounded revision history"\n          git push origin HEAD:feature/template-generator-features
