name: GEN-F8 contracts QA

on:
  push:
    branches:
      - feature/template-generator-features
    paths:
      - .github/workflows/gen-f8-contracts-qa.yml

permissions:
  contents: write

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-features
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format GEN-F8 contracts
        run: npx prettier --write src/features/ticket-generator/lib/evidenceWorkspace.js src/features/ticket-generator/lib/evidenceWorkspace.test.js
      - name: Focused GEN-F8 contract tests
        run: npx vitest run src/features/ticket-generator/lib/evidenceWorkspace.test.js src/infrastructure/ocr/imageValidation.test.js
      - name: Persist validated formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- src/features/ticket-generator/lib/evidenceWorkspace.js src/features/ticket-generator/lib/evidenceWorkspace.test.js; then
            echo "Formatting already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ticket-generator/lib/evidenceWorkspace.js src/features/ticket-generator/lib/evidenceWorkspace.test.js
          git commit -m "style(generator): format GEN-F8 evidence contracts"
          git push origin HEAD:feature/template-generator-features
