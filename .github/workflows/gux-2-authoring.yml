name: GUX-2 core incident authoring

on:
  push:
    branches:
      - feature/template-generator-visual-overhaul
    paths:
      - .github/workflows/gux-2-authoring.yml

permissions:
  contents: write

jobs:
  authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/template-generator-visual-overhaul
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply GUX-2 presentation changes
        run: node scripts/apply-gux-2-authoring.mjs apply

      - name: Format
        run: npm run format

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Targeted core authoring regression
        run: >-
          npx vitest run
          src/features/ticket-generator/pages/TicketGeneratorPage.test.jsx
          src/features/ticket-generator/pages/TicketGeneratorSmartTitle.test.jsx
          src/features/ticket-generator/pages/TicketGeneratorImpactBuilder.test.jsx
          src/features/ticket-generator/components/ImpactBuilder.test.jsx

      - name: Full unit and component suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Record GUX-2 evidence
        run: node scripts/apply-gux-2-authoring.mjs record

      - name: Commit validated GUX-2 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/features/ticket-generator/pages/TicketGeneratorPage.jsx \
            src/features/ticket-generator/components/ImpactListEditor.jsx \
            src/features/ticket-generator/components/ImpactBuilder.jsx \
            src/styles/app.css \
            docs/08-post-mvp/TEMPLATE-GENERATOR-VISUAL-OVERHAUL-TRACKER.md
          git commit -m 'feat(generator-ui): complete GUX-2 authoring hierarchy'
          git push origin HEAD:feature/template-generator-visual-overhaul
