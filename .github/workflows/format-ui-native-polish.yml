name: UI Native Polish Formatter

on:
  push:
    branches:
      - feature/ui-native-polish

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/ui-native-polish
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run format

      - name: Persist exact formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatter produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src e2e scripts '*.js' '*.json' '*.html'
          git commit -m "style(ui): persist formatter output"
          git push origin HEAD:feature/ui-native-polish
