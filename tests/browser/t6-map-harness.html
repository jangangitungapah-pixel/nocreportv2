<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T6 Map Browser QA Harness</title>
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      html,
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main id="map" aria-label="T6 synthetic Cut Point map"></main>
    <script type="module">
      import { createLeafletMap } from '/src/infrastructure/map/index.js';

      window.__t6HarnessReady = false;
      window.__openedTicket = null;

      const map = await createLeafletMap({
        container: document.querySelector('#map'),
        config: {
          tileUrl:
            'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22256%22 height=%22256%22%3E%3Crect width=%22256%22 height=%22256%22 fill=%22%23e5e7eb%22/%3E%3C/svg%3E',
          attribution: 'T6 browser QA',
        },
        onOpenTicket: (ticketId) => {
          window.__openedTicket = ticketId;
        },
      });

      map.setMarkers([
        {
          ticketId: 'qa-ticket-1',
          latitude: -6.2,
          longitude: 106.816666,
          coordinateLabel: '-6.20000, 106.81667',
          externalTtNumber: 'INC-QA-001',
          title: 'Synthetic browser QA Cut Point',
          status: 'RUNNING',
          cutPoint: 'Jakarta QA splice point',
          pic: 'QA Operator',
          latestProgress: 'Browser QA marker is ready',
          updatedLabel: '21/08/2026 07:58',
        },
      ]);

      window.__t6HarnessReady = true;
    </script>
  </body>
</html>
